line-length = 120
indent-width = 4
target-version = "py310"
extend-exclude = ["build", "dist", "install", "log"]

[lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[lint.pydocstyle]
convention = "google"

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
