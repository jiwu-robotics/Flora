      repository_write:
        - resolved-feature-plan-bundle
        - resolved-feature-tasks
      multica_access: none
      git_control: scoped-ordinary-commit
      destructive_operations: false
      credentials: none
    concurrency:
      max_concurrent_tasks: 1
      cross_work_item: conditional
