name: Orchestration controls

on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact source revision frozen by the integration queue
        required: true
        type: string
      target_revision:
        description: Exact target revision frozen by the integration queue
        required: true
        type: string
      evidence_json:
        description: Exact-revision evidence generated by Nail Down default evaluators
        required: true
        type: string

permissions:
  contents: read

env:
  SOURCE_REVISION: ${{ inputs.source_revision }}
  TARGET_REVISION: ${{ inputs.target_revision }}
  EVIDENCE_JSON: ${{ inputs.evidence_json }}

jobs:
  control:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - orchestration-contract
          - work-type-isolation
          - work-item-execution-isolation
          - cross-work-item-scope-conflict
          - resource-lease-integrity
          - integration-target-freshness
          - artifact-revision-integrity
          - permission-boundary
          - human-approval-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen integration revisions
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$SOURCE_REVISION"
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          git cat-file -e "$TARGET_REVISION^{commit}"
      - name: Verify operator control evidence
        env:
          CONTROL_CHECK: ${{ matrix.check }}
        run: |
          set -euo pipefail
          evidence_file="$RUNNER_TEMP/orchestration-checks.json"
          printf '%s' "$EVIDENCE_JSON" > "$evidence_file"
          python3 .agents/skills/multica-orchestrator-cli/cli/run.py dispatch check \
            --check "$CONTROL_CHECK" \
            --evidence "$evidence_file" \
            --source "$SOURCE_REVISION" \
            --target "$TARGET_REVISION"

  project-test:
    name: project-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen integration revisions
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$SOURCE_REVISION"
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          git cat-file -e "$TARGET_REVISION^{commit}"
      - name: Execute project test contract
        run: |
          python3 .agents/skills/multica-orchestrator-cli/cli/run.py dispatch check \
            --check project-test \
            --project-policy .multica/orchestration-ci-policy.json \
            --execute-project-command \
            --repository-root "$GITHUB_WORKSPACE" \
            --source "$SOURCE_REVISION" \
            --target "$TARGET_REVISION"

  project-lint:
    name: project-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen integration revisions
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$SOURCE_REVISION"
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          git cat-file -e "$TARGET_REVISION^{commit}"
      - name: Execute project lint contract
        run: |
          python3 .agents/skills/multica-orchestrator-cli/cli/run.py dispatch check \
            --check project-lint \
            --project-policy .multica/orchestration-ci-policy.json \
            --execute-project-command \
            --repository-root "$GITHUB_WORKSPACE" \
            --source "$SOURCE_REVISION" \
            --target "$TARGET_REVISION"

  project-build:
    name: project-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen integration revisions
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$SOURCE_REVISION"
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          git cat-file -e "$TARGET_REVISION^{commit}"
      - name: Execute project build contract
        run: |
          python3 .agents/skills/multica-orchestrator-cli/cli/run.py dispatch check \
            --check project-build \
            --project-policy .multica/orchestration-ci-policy.json \
            --execute-project-command \
            --repository-root "$GITHUB_WORKSPACE" \
            --source "$SOURCE_REVISION" \
            --target "$TARGET_REVISION"
