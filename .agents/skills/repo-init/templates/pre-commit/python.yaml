repos:
  - repo: local
    hooks:
      - id: repository-hygiene
        name: repository hygiene
        entry: python3 tools/pre_commit_hygiene.py
        language: system
        files: '\.(?:ya?ml|json|toml|py|pyi|c|cc|cpp|cxx|h|hh|hpp|hxx)$'
      - id: ruff-format
        name: ruff format
        entry: ruff format --check
        language: system
        types_or: [python, pyi]
      - id: ruff-check
        name: ruff check
        entry: ruff check
        language: system
        types_or: [python, pyi]
