# Docker Task Runner uses the host engine and the existing Flora image.
# Bind sources are host paths; see src/infer/README.md for prerequisites.
id: jiwu_flora
namespace: flora.jiwu
description: Validate and optionally annotate Jiwu DAgger high_cam or UMI ego_l episodes.
inputs:
  - id: dataset
    type: SELECT
    values: [dagger, umi]
    defaults: umi
  - id: max_parts
    type: INT
    defaults: 0
    description: Maximum video parts, 0 processes the full dataset.
  - id: inference
    type: BOOL
    defaults: true
    description: Run GPU inference after input validation; set false for CPU validation only.
  - id: model_mode
    type: SELECT
    values: [both, tempseg, captioner]
    defaults: tempseg
    description: Select both models in sequence or one model.
  - id: segments_execution_id
    type: STRING
    required: false
    description: TempSeg execution ID required for captioner mode.
tasks:
  - id: validate
    type: io.kestra.plugin.scripts.shell.Commands
    runIf: "{{ inputs.inference == false }}"
    containerImage: jiwu.robotics/robox-datapilot/flora:latest
    outputFiles:
      - "kestra-output/*.json"
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      host: unix:///var/run/docker.sock
      pullPolicy: NEVER
      user: "0:0"
      volumes:
        - /mnt/sdb/jiwu-dagger:/data/jiwu-dagger
        - /mnt/sdb/jiwu-umi:/data/jiwu-umi
    env:
      DATASET_KIND: "{{ inputs.dataset }}"
      MAX_PARTS: "{{ inputs.max_parts }}"
      EXECUTION_ID: "{{ execution.id }}"
      MODEL_MODE: "{{ inputs.model_mode }}"
    commands:
      - |
        set -eu
        kestra_output="$PWD/kestra-output"
        case "$DATASET_KIND" in
          dagger) dataset=/data/jiwu-dagger/Robot_data_liqian_20261030_174559 ;;
          umi) dataset=/data/jiwu-umi/Robot_data_Bing_20261111_144059 ;;
          *) exit 2 ;;
        esac
        cd /app
        set -- --kind "$DATASET_KIND" --dataset "$dataset" --max-parts "$MAX_PARTS" --output "$dataset/tempseg/$EXECUTION_ID"
        if [ "$DATASET_KIND" = dagger ] && [ "$MODEL_MODE" = tempseg ]; then
          set -- "$@" --mode tempseg --direct-parquet
        fi
        python -m src.infer "$@"
        mkdir -p "$kestra_output"
        cp "$dataset/tempseg/$EXECUTION_ID/"*.json "$kestra_output/"
  - id: annotate
    type: io.kestra.plugin.scripts.shell.Commands
    runIf: "{{ inputs.inference == true }}"
    containerImage: jiwu.robotics/robox-datapilot/flora:latest
    outputFiles:
      - "kestra-output/*.json"
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      host: unix:///var/run/docker.sock
      pullPolicy: NEVER
      user: "0:0"
      deviceRequests:
        - driver: nvidia
          count: "1"
          capabilities: [[gpu]]
      volumes:
        - /mnt/sdb/jiwu-dagger:/data/jiwu-dagger
        - /mnt/sdb/jiwu-umi:/data/jiwu-umi
        - /mnt/sdb/.datapilot-modelzoo:/model_zoo
    env:
      DATASET_KIND: "{{ inputs.dataset }}"
      MAX_PARTS: "{{ inputs.max_parts }}"
      EXECUTION_ID: "{{ execution.id }}"
      MODEL_MODE: "{{ inputs.model_mode }}"
      SEGMENTS_EXECUTION_ID: "{{ inputs.segments_execution_id | default('') }}"
      FLORA_MODEL_CACHE: /model_zoo/flora/models
      HF_HOME: /model_zoo/huggingface
    commands:
      - |
        set -eu
        kestra_output="$PWD/kestra-output"
        case "$DATASET_KIND" in
          dagger) dataset=/data/jiwu-dagger/Robot_data_liqian_20261030_174559 ;;
          umi) dataset=/data/jiwu-umi/Robot_data_Bing_20261111_144059 ;;
          *) exit 2 ;;
        esac
        cd /app
        set -- --kind "$DATASET_KIND" --dataset "$dataset" --max-parts "$MAX_PARTS" --output "$dataset/tempseg/$EXECUTION_ID" --run --mode "$MODEL_MODE"
        if [ "$DATASET_KIND" = dagger ] && [ "$MODEL_MODE" = tempseg ]; then
          set -- "$@" --direct-parquet
        fi
        if [ "$MODEL_MODE" = captioner ]; then
          case "$SEGMENTS_EXECUTION_ID" in
            ""|*[!a-zA-Z0-9_-]*) echo "A valid TempSeg execution ID is required" >&2; exit 2 ;;
          esac
          set -- "$@" --segments-dir "$dataset/tempseg/$SEGMENTS_EXECUTION_ID"
        fi
        # Kestra maps stderr to ERROR, even for progress and library warnings.
        # Forward only known non-error messages to stdout; retain all other stderr.
        python - "$@" <<'PYLOG'
        import re
        import subprocess
        import sys

        warning_prefixes = (
            "[transformers] The `use_fast` parameter is deprecated",
            "[transformers] Kwargs passed to `processor.__call__`",
            "[transformers] Qwen3VL video processing does not apply",
            "[transformers] `causal_conv1d_fn` is falling back",
            "[transformers] `chunk_gated_delta_rule` is falling back",
            "[transformers] `causal_conv1d_update` is falling back",
            "[transformers] `fused_recurrent_gated_delta_rule` is falling back",
        )
        progress = re.compile(r"^(?:Fetching \d+ files:|Loading weights:|\d+% (?:Finding actions|Loading the action segmenter|Stitching finished|Writing captions))")
        warning_context = False
        process = subprocess.Popen(
            [sys.executable, "-m", "src.infer", *sys.argv[1:]],
            stderr=subprocess.PIPE,
            text=True,
            bufsize=1,
        )
        assert process.stderr is not None
        for line in process.stderr:
            stripped = line.strip()
            known_warning = stripped.startswith(warning_prefixes) or (
                "peft/mapping_func.py:" in stripped and "UserWarning:" in stripped
            )
            continuation = warning_context and stripped == "warnings.warn("
            target = sys.stdout if known_warning or continuation or progress.match(stripped) else sys.stderr
            print(line, end="", file=target, flush=True)
            warning_context = known_warning
        sys.exit(process.wait())
        PYLOG
        mkdir -p "$kestra_output"
        cp "$dataset/tempseg/$EXECUTION_ID/"*.json "$kestra_output/"
