  - role_key: feature-loop-checker
    description: "独立验证一个 immutable Loop iteration；不修改 maker state"
    instructions: ../agents/roles/feature-loop-checker.md
    work_type: feature
    responsibility: verifier
    required_skills:
      - speckit-loop-check
