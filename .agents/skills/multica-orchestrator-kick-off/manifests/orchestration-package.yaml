      multica_access: none
      git_control: scoped-ordinary-commit-no-worktree-create
      destructive_operations: false
      credentials: none
    concurrency:
      max_concurrent_tasks: 1
      cross_work_item: conditional
      requires:
        - current-execution-checkout-scope
        - clear-scope-conflict-gate
