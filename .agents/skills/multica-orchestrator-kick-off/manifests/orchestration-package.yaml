      - excluded
    forbidden_skills:
      - speckit-bug-assess
      - speckit-bug-fix
    permissions:
      repository_write:
        - resolved-fix-test-report-only
      multica_access: none
      git_control: scoped-report-commit
      destructive_operations: false
      credentials: none
    concurrency:
      max_concurrent_tasks: 1
      cross_work_item: true
      requires:
        - current-execution-independent-session
        - immutable-fix-revision

shared_intake:
  role_key: shared-intake
  squad_membership: [feature, fix]
  routes_to:
    - squad: feature
      leader: workflow-leader
      required_work_type: feature
    - squad: fix
      leader: workflow-leader
      required_work_type: fix

human_participation:
  project_binding_contract: multica-orchestrator-nail-down.project-binding-ref.v8
  authority:
    designation: HumanDesignationRef
    decision: HumanDecisionRef
    notification_recipient_is_authority: false
  notification:
    actor_role: workflow-leader
    target: exact-designated-human-member-only
    automatic_initial: true
    atomic_reservation:
      required: true
      key_fields:
        - project_ref
        - work_item_ref
        - execution_ref
        - subject
        - designation_ref
        - participation_plan_ref
        - sorted_input_revisions
      one_initial_per_current_request: true
    provider_scheduled_reminders:
      max: 2
      intervals:
        - PT24H
        - PT72H
    readback_required: true
    forbidden:
      - mixed-agent-and-human-mention
      - squad-mention-from-delegation
      - all-mention
      - assignment-by-leader
      - direct-rerun
      - cancel
      - decision-inference
  decision_routing:
    native_leader_trigger: true
    member_result_retriggers_leader: true
    human_gate_requires_current_decision: true
    leader_dispatch_record_required: true
    provider_run_receipt_required: true
    active_or_queued_run_deduplication_required: true
    current_execution_run_deduplication_required: true
squads:
  - squad_key: feature
    description: "从 Feature Brief 到 develop 集成证据的受门禁交付 Squad"
    instructions: ../squads/feature-squad.md
    work_type: feature
    leader: workflow-leader
    members:
      - role_key: feature-governance-producer
        squad_role: "治理、Architecture、Roadmap 和 ADR 草案唯一 writer"
      - role_key: feature-requirement-producer
        squad_role: "Feature Spec 唯一 writer；处理产品澄清"
      - role_key: feature-requirement-reviewer
        squad_role: "独立验证 current Spec；只产出 Requirement Gate"
      - role_key: feature-planning-producer
        squad_role: "Plan 与 tasks.md 唯一普通 writer"
      - role_key: feature-reviewer
        squad_role: "独立审查 ADR、Plan、Roadmap 与实现证据"
      - role_key: feature-core-maker
        squad_role: "Core route 源码与测试 writer"
      - role_key: feature-loop-maker
        squad_role: "Loop contract、iteration 与 maker state writer"
      - role_key: feature-loop-checker
        squad_role: "独立检查最新 Loop iteration；不修改 maker state"
      - role_key: feature-loop-guard
        squad_role: "呈现 Loop 风险并记录 Human sign-off evidence"
      - role_key: feature-convergence-reviewer
        squad_role: "闭环复核并只追加 Convergence tasks"
      - role_key: shared-intake
        squad_role: "合同变化重分类与缺失信息澄清；不派活"
      - role_key: commit-policy-reviewer
        squad_role: "独立验证 producer commits、scope、message 与 Work-Item footer"
    concurrency:
      unit: work-item-execution
      cross_work_item_parallel: different-repository-root-only
      prerequisites:
        - collaboration-runtime-placement
        - in-place-root-serialization
        - clear-scope-conflict-gate
        - no-conflicting-resource-lease
      within_work_item: feature-dag-serialized
      core_loop_mutually_exclusive: true
      tasks_writers_serialized: true

  - squad_key: fix
    description: "从缺陷复现到 develop 集成证据的最小修复 Squad"
    instructions: ../squads/fix-squad.md
    work_type: fix
    leader: workflow-leader
    members:
      - role_key: fix-assessor
        squad_role: "复现偏差、定位根因并判定 fixable 或 Feature escalation"
      - role_key: fix-maker
        squad_role: "在 approved Fix scope 内实施最小修复"
      - role_key: fix-verifier
        squad_role: "独立重放原始症状与 critical regression"
      - role_key: shared-intake
        squad_role: "合同变化重分类与缺失信息澄清；不派活"
      - role_key: commit-policy-reviewer
        squad_role: "独立验证 producer commits、scope、message 与 Work-Item footer"
    concurrency:
      unit: work-item-execution
      cross_work_item_parallel: different-repository-root-only
      prerequisites:
        - collaboration-runtime-placement
        - in-place-root-serialization
        - clear-scope-conflict-gate
        - no-conflicting-resource-lease
      within_work_item:
        - assess-before-fix
        - fix-before-verify

issue_templates:
  feature:
    path: ../issues/issue-input-contracts.md
    anchor: feature-issue-template
    required_work_type: feature
  fix:
    path: ../issues/issue-input-contracts.md
    anchor: fix-issue-template
    required_work_type: fix

server_preconditions:
  - id: status-contract-readback
    owner: workspace-administrator
    required: true
    failure: STATUS_CONTRACT_DRIFT

project_binding_requirements:
  - id: requirement-rule-fragments
    owner: repository-provider
    required: true
    failure: REQUIREMENT_RULES_UNAVAILABLE
  - id: disable-mandatory-worktree-hook
    owner: repository-provider
    required: true
    failure: WORKTREE_HOOK_CONFLICT
  - id: approved-gitflow-checkout
    owner: repository-provider-and-human-authority
    required: true
    failure: WRITE_SCOPE_BLOCKED
  - id: gitflow-protection-readback
    owner: repository-provider-and-human-authority
    required: true
    failure: BRANCH_POLICY_VIOLATION
  - id: commit-policy-readback
    owner: repository-administrator
    required: true
    failure: COMMIT_POLICY_INVALID
  - id: pr-integration-readback
    owner: repository-provider
    required: true
    failure: INTEGRATION_POLICY_INVALID
  - id: loop-effective-isolation-none
    owner: repository-provider
    required_when: loop-route-enabled
    failure: LOOP_INELIGIBLE
  - id: loop-independent-checker-session
    owner: runtime-provider
    required_when: loop-route-enabled
    failure: LOOP_INELIGIBLE
  - id: human-designation-confirmation
    owner: human-designation-operator
    required: true
    failure: HUMAN_DESIGNATION_UNCONFIRMED
  - id: human-decision-ledger
    owner: human-designation-operator-and-workflow-leader
    required: true
    failure: HUMAN_APPROVAL_EVIDENCE_INVALID
  - id: human-participation-plan
    owner: human-designation-operator-and-workflow-leader
    required: true
    failure: HUMAN_PARTICIPATION_PLAN_UNRESOLVED
  - id: human-notification-controller-readback
    owner: multica-provider-and-human-designation-operator
    required: true
    failure: HUMAN_NOTIFICATION_CONTROL_UNVERIFIED
  - id: multi-work-item-execution-isolation
    owner: runtime-provider
    required_before: concurrent-dispatch
    failure: MULTI_WORK_ITEM_EXECUTION_ISOLATION_UNVERIFIED
  - id: atomic-workflow-ledger
    owner: orchestration-control-owner
    required_before: concurrent-dispatch
    failure: WORKFLOW_LEDGER_ATOMICITY_UNVERIFIED
  - id: cross-work-item-scope-conflict-gate
    owner: repository-provider
    required_before: first-source-write
    failure: WORK_SCOPE_CONFLICT_UNRESOLVED
  - id: repository-global-resource-lease
    owner: repository-provider
    required_before: concurrent-repository-write
    failure: RESOURCE_LEASE_CONTROL_UNVERIFIED
  - id: repository-integration-queue
    owner: repository-provider
    required_before: concurrent-pr-integration
    failure: INTEGRATION_QUEUE_UNVERIFIED
  - id: collaboration-runtime-and-root-serialization
    owner: project-runtime-provider
    required_before: first-execution-member-dispatch
    failure: COLLABORATION_RUNTIME_PLACEMENT_UNVERIFIED
  - id: atomic-human-notification-dedupe
    owner: workflow-leader-and-provider
    required_before: concurrent-human-gates
    failure: HUMAN_NOTIFICATION_DEDUPE_UNVERIFIED

human_approval_subjects:
  - governance-input
  - constitution
  - architecture
  - adr
  - roadmap
  - tasks
  - implementation-route
  - loop-signoff
  - risk-override
  - final-acceptance

completion:
  agent_completion_is_issue_completion: false
  issue_done_requires:
    - all-required-gates-current-and-approved
    - no-open-blockers
    - exact-artifact-revisions
    - human-final-acceptance
    - current-commit-ref
    - current-integration-ref
    - promotion-ref-when-release-or-hotfix
  concurrency_requires:
    - current-work-item-execution-ref
    - no-unresolved-scope-conflict
    - no-active-conflicting-resource-lease
    - current-source-and-target-revisions
    - no-duplicate-active-or-queued-run
    - no-overlapping-integration-attempt
