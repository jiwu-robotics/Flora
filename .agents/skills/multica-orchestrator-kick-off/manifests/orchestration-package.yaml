status_contract:
  authority: requirements-and-maintained-triage-contract
  provider_verification: required-before-application
  statuses:
    - meaning: needs-maintainer-evaluation
      key: needs_triage
      category: backlog
    - meaning: waiting-for-actionable-information
      key: needs_information
      category: blocked
    - meaning: ready-for-explicit-agent-dispatch
      key: ready_for_agent
      category: backlog
    - meaning: ready-for-human-work-or-decision
      key: ready_for_human
      category: todo
    - meaning: explicitly-rejected
      key: wontfix
      category: cancelled
  gate_values:
    - APPROVED
    - APPROVED_NA
    - REJECTED
    - BLOCKED
  verification: human-web-confirmation
  evidence_required: false

policies:
  default_worktree: true
  execution_mode: worktree
  checkout_provider: multica-runtime-and-repository-provider
  nested_worktree_creation: forbidden
  mandatory_after_specify_worktree_hook: forbidden
  work_item_execution:
    one_current_per_repository_work_item: true
    epoch_required: true
    one_active_writer_per_work_item: true
    handoff_binding:
      - execution_ref
      - work_item_branch_ref
      - run_checkout_ref
      - scope_ref
    cross_work_item_artifact_consumption: forbidden
    completed_history: retained
  concurrency:
    unit: work-item-execution
    cross_work_item_parallelism: scope-conflict-gate-controlled
    same_work_item_writer_parallelism: forbidden
    scope_conflict_gate_before_first_source_write: true
    repository_global_resource_lease: atomic
    same_repository_target_integration: serialized
    fallback_when_serialization_or_atomicity_unverified: BLOCKED
    safe_role_limits:
      workflow-leader:
        max_concurrent_tasks_when_atomic_ledger_unverified: 1
      commit-policy-reviewer:
        max_concurrent_tasks_when_report_isolation_unverified: 1
  invocation:
    execution_context_schema: multica-coach.execution-context-ref.v1
    project_binding_schema: multica-orchestrator-nail-down.project-binding-ref.v11
    active_release_schema: multica-orchestrator-migrate.active-project-release.v2
    run_admission_schema: multica-orchestrator-dispatch.run-admission-ref.v1
    leader_dispatch_schema: multica-coach.leader-dispatch-ref.v1
    leader_dispatch_set_schema: multica-coach.leader-dispatch-set-ref.v1
    provider_run_receipt_schema: multica-coach.provider-run-receipt-ref.v1
    handoff_schema: multica-coach.handoff-ref.v3
    artifact_schema: multica-coach.artifact-ref.v2
    gate_schema: multica-coach.gate-record.v2
    execution_schema: multica-coach.work-item-execution-ref.v4
    work_item_branch_schema: multica-coach.work-item-branch-ref.v1
    run_checkout_schema: multica-coach.run-checkout-ref.v1
    checkout_schema: multica-coach.checkout-ref.v5
    one_operation_per_run: true
    one_consumer_per_handoff: true
    native_squad_routing_required: true
    leader_can_dispatch_roster_members: true
    member_direct_chaining: false
    eligibility_is_not_authorization: true
    role_operations:
      shared-intake: [triage-inspect, triage-apply, squad-bind, reclassify]
      workflow-leader: [coordinate-trigger, validate-handoff, record-gate, record-scope-lease, record-invalidation, notify-human, record-lifecycle]
      feature-governance-producer: [governance-draft, roadmap-write, adr-draft]
      feature-requirement-producer: [specify, clarify-spec]
      feature-requirement-reviewer: [requirement-check]
      feature-planning-producer: [adr-context, plan, tasks]
      feature-reviewer: [adr-check, analyze, roadmap-sync, roadmap-brief, roadmap-debrief]
      feature-core-maker: [implement-core]
      feature-loop-maker: [loop-define, loop-iterate, loop-status]
      feature-loop-checker: [loop-check, loop-status-read]
      feature-loop-guard: [loop-guard]
      feature-convergence-reviewer: [converge]
      fix-assessor: [fix-assess]
      fix-maker: [fix-implement]
      fix-verifier: [fix-verify]
      commit-policy-reviewer: [verify-commit]
  implementation_route:
    choices:
      - core
      - loop
    selected_by: human-authority
    exactly_one: true
    locked_after_first_source_write: true
  loop:
    eligible: true
    isolation: none
    complete_bundle_required: true
    independent_checker_required: true
    human_guard_required: true
    shared_state_required: true
    iteration_budget_required: true
    cross_work_item_shared_state: forbidden
  feature_fix_execution_agents_shared: false
  producer_self_approval: forbidden
  workflow_ledger: append-only-atomic-compare-and-set
  tasks_write_policy:
    planner: EXCLUSIVE_WRITE
    human_and_analyze: READ_ONLY
    convergence: APPEND_ONLY
    cross_feature_paths: isolated-by-feature-directory
  human_designation:
    policy: human-designation-policy
    current_email_required: true
    explicit_consent_required: true
    provider_role_binding_required: false
    authorization_receipt_required: false
    portable_document_must_not_contain_email: true
    first_feature_gate: before-specify
    initialization_and_major_change_gate: before-governance-input
    fix_gate: before-fix-assess
  branch_commit:
    policy: branch-and-commit-policy
    workflow_profile: git-flow
    main_ref: main
    develop_ref: develop
    feature_pattern: feature/<owner>/<work-item-id>-<slug>
    fix_pattern: fix/<owner>/<work-item-id>-<slug>
    release_pattern: release/<version>
    hotfix_pattern: hotfix/<owner>/<work-item-id>-<slug>
    branch_provisioner: repository-provider-and-human-authority
    commit_authority: repository-writing-agent-current-run-only
    commit_policy_reviewer: commit-policy-reviewer
    merge_method: provider-merge-commit-only
    work_item_footer_required: true
    push_merge_agent_permissions: forbidden
    per_checkout_cwd_and_git_index_isolation_required: true
    github_branch_permissions_required: false
    integration_prerequisites: exact-source-target-human-verified-check-receipts-and-approval
    repository_target_queue: serialized
  gitflow_guidance:
    skill: git-workflow
    source: project-local-locked-skill
    use: policy-reference-only
    precedence: branch-and-commit-policy
    grants_git_mutation_permission: false
skill_bundles:
  feature_execution:
    - speckit-constitution
    - speckit-roadmap-write
    - speckit-roadmap-sync
    - speckit-specify
    - speckit-checklist
    - speckit-clarify
    - speckit-adrkit-context
    - speckit-plan
    - speckit-adrkit-check
    - speckit-adrkit-draft
    - speckit-tasks
    - speckit-analyze
    - speckit-roadmap-brief
    - speckit-implement
    - speckit-loop-define
    - speckit-loop-run
    - speckit-loop-check
    - speckit-loop-guard
    - speckit-loop-status
    - speckit-roadmap-debrief
    - speckit-converge
  fix_execution:
    - speckit-bug-assess
    - speckit-bug-fix
    - speckit-bug-test
  source_control:
    - conventional-commit
  excluded:
    - multica-orchestrator-link-up
    - multica-orchestrator-nail-down
    - multica-create-agent
    - speckit-setup-project
    - speckit-taskstoissues
    - speckit-worktrees-specify
    - speckit-worktrees-create
    - speckit-worktrees-list
    - speckit-worktrees-clean
    - multica-coach

agents:
  - role_key: shared-intake
    description: "统一接收、分类与准入工作项；不负责派发执行角色"
    instructions: ../agents/roles/shared-intake.md
    work_type: shared
    responsibility: intake-producer
    required_skills:
      - multica-triage
      - multica-cli
      - multica-orchestrator-dispatch
    optional_skills: []
    forbidden_skill_bundles:
      - feature_execution
      - fix_execution
      - excluded
    permissions:
      repository_write:
        - governed-rejection-memory-only
      multica_access: triage-inspect-apply-and-squad-bind-no-start-only
      git_control: read-only
      destructive_operations: false
      credentials: runtime_injected
    concurrency:
      max_concurrent_tasks: 1
      unit: work-item-execution-admission
      requires:
        - atomic-repository-work-item-epoch-deduplication
      duplicate_dispatch: forbidden

  - role_key: workflow-leader
    description: "Feature 与 Fix Squad 的唯一协调者；校验门禁并按 roster 精确路由"
    instructions: ../agents/roles/workflow-leader.md
    work_type: shared
    responsibility: leader
    required_skills:
      - multica-cli
      - multica-orchestrator-dispatch
    optional_skills: []
    forbidden_skills:
      - multica-triage
    forbidden_skill_bundles:
      - feature_execution
      - fix_execution
      - excluded
    permissions:
      repository_write: []
      multica_access: native-squad-coordination-recording-and-designated-human-notification-only
      git_control: read-only
      destructive_operations: false
      credentials: runtime_injected
    concurrency:
      max_concurrent_tasks: 1
      unit: work-item-execution
      requires:
        - atomic-workflow-ledger
        - atomic-resource-leases
        - atomic-notification-reservation

  - role_key: commit-policy-reviewer
    description: "独立验证 producer commits、scope、message 与 Work-Item footer"
    instructions: ../agents/roles/commit-policy-reviewer.md
    work_type: shared
    responsibility: commit-policy-reviewer
    required_skills:
      - conventional-commit
    optional_skills: []
    forbidden_skill_bundles:
      - feature_execution
      - fix_execution
      - excluded
    permissions:
      repository_write: []
      multica_access: none
      git_control: read-only
      destructive_operations: false
      credentials: none
    concurrency:
      max_concurrent_tasks: 1
      unit: immutable-commit-range
      requires:
        - current-execution-candidate-commit-binding
        - immutable-source-revision
        - isolated-report-namespace

  - role_key: feature-governance-producer
    description: "起草并维护 Constitution、Architecture、Roadmap 与获授权 ADR 草案"
    instructions: ../agents/roles/feature-governance-producer.md
    work_type: feature
    responsibility: producer
    required_skills:
      - speckit-constitution
      - speckit-roadmap-write
      - conventional-commit
    optional_skills:
      - name: speckit-adrkit-draft
        when: human-authorized-current-plan-adr-gap
    forbidden_skill_bundles:
      - fix_execution
      - excluded
    permissions:
      repository_write:
        - .specify/memory/constitution.md
        - .specify/memory/architecture.md
        - configured-roadmap-path
        - configured-adr-draft-path
      multica_access: none
      git_control: scoped-ordinary-commit
      destructive_operations: false
      credentials: none
    concurrency:
      max_concurrent_tasks: 1
      cross_work_item: conditional
      requires:
        - current-execution-checkout-scope
        - repository-global-resource-lease

  - role_key: feature-requirement-producer
    description: "把已接受 Feature Brief 写成 canonical Spec 并处理产品澄清"
    instructions: ../agents/roles/feature-requirement-producer.md
    work_type: feature
    responsibility: producer
    required_skills:
      - speckit-specify
      - conventional-commit
    optional_skills:
