        - clear-scope-conflict-gate
        - no-conflicting-resource-lease

  - role_key: feature-loop-maker
    description: "只在 loop route 内定义并执行 maker iteration"
    instructions: ../agents/roles/feature-loop-maker.md
    work_type: feature
    responsibility: maker
    required_skills:
