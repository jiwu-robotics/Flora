repos:
  - repo: local
    hooks:
      - id: repository-hygiene
        name: repository hygiene
        entry: python3 tools/pre_commit_hygiene.py
        language: system
        files: '\.(?:ya?ml|json|toml|py|pyi|c|cc|cpp|cxx|h|hh|hpp|hxx)$'
      - id: clang-format
        name: clang-format
        entry: clang-format --dry-run --Werror
        language: system
        files: '\.(?:c|cc|cpp|cxx|h|hh|hpp|hxx)$'
