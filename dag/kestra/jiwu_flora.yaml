# Requires an explicitly selected image containing the current native-results code.
# Bind sources are host paths; see src/infer/README.md for prerequisites.
id: jiwu_flora
namespace: flora.jiwu
description: Validate and optionally annotate Jiwu DAgger high_cam or UMI ego_l episodes.
inputs:
  - id: flora_image
    type: STRING
    required: true
    description: Preloaded image containing current code; use sha256 image ID or repository@sha256 digest, not the old latest image.
  - id: dataset_key
    type: STRING
    required: false
    description: Optional native-results dataset identifier (TempSeg only; defaults to directory name).
  - id: episodes
    type: ARRAY
    itemType: INT
    defaults: []
    description: Optional distinct episode indices for TempSeg; empty selects all episodes.
  - id: include_flags
    type: BOOL
    defaults: true
    description: Compute episode-level boundary suggestions in TempSeg results.
  - id: dataset
    type: SELECT
    values: [dagger, umi]
    defaults: umi
    description: Dataset type and corresponding mount.
  - id: dataset_dir
    type: STRING
    required: true
    description: Dataset directory relative to its type mount, or an absolute host path inside an allowed dataset mount.
  - id: max_parts
    type: INT
    defaults: 0
    min: 0
    description: GPU part limit; CPU preflight checks the entire selection. Incomplete TempSeg inference fails publication.
  - id: inference
    type: BOOL
    defaults: true
    description: Run GPU inference after input validation; set false for CPU validation only.
  - id: model_mode
    type: SELECT
    values: [both, tempseg, captioner]
    defaults: tempseg
    description: Select both models in sequence or one model.
  - id: segments_execution_id
    type: STRING
    required: false
    description: TempSeg execution ID required for captioner mode.
variables:
  stage_driver: |
    import json
    import os
    from pathlib import Path
    import re
    import shutil
    import subprocess
    import sys

    from src.infer.direct import atomic_json

    root, artifacts = Path(sys.argv[1]), Path(sys.argv[2])
    stage = os.environ["STAGE"]
    mode = os.environ["MODEL_MODE"]
    execution = os.environ["EXECUTION_ID"]
    if not re.fullmatch(r"[a-zA-Z0-9_-]+", execution):
        raise ValueError("Invalid execution ID")
    if not re.fullmatch(r"(?:sha256:|[^\s]+@sha256:)[0-9a-f]{64}", os.environ["FLORA_IMAGE"]):
        raise ValueError("flora_image must be a full local sha256 image ID or repository digest")
    help_text = subprocess.check_output([sys.executable, "-m", "src.infer", "--help"], text=True)
    if not all(flag in help_text for flag in ("--dataset-key", "--episodes")):
        raise ValueError("Selected image lacks native-results CLI support; rebuild it from current code")
    episodes = json.loads(os.environ["EPISODES_JSON"])
    if not isinstance(episodes, list) or any(type(i) is not int or i < 0 for i in episodes) or len(set(episodes)) != len(episodes):
        raise ValueError("episodes must contain distinct nonnegative integers")
    key = os.environ["DATASET_KEY"]
    if mode != "tempseg" and (episodes or key):
        raise ValueError("dataset_key and episodes require TempSeg mode")
    run = root / "temp_seg" / "runs" / execution
    output = run / ("validation" if stage == "validate" else "inference")
    if not output.resolve().is_relative_to(root):
        raise ValueError("Output path escapes dataset root")
    command = [sys.executable, "-m", "src.infer", "--kind", os.environ["DATASET_KIND"],
        "--dataset", str(root), "--mode", mode, "--max-parts",
        "0" if stage == "validate" else os.environ["MAX_PARTS"], "--output", str(output)]
    if mode == "tempseg":
        if os.environ["DATASET_KIND"] == "dagger":
            command += ["--direct-parquet"]
        if os.environ["INCLUDE_FLAGS"] == "true":
            command += ["--include-flags"]
        if key:
            command += ["--dataset-key", key]
        if episodes:
            command += ["--episodes", *map(str, episodes)]
    if mode == "captioner":
        previous = os.environ["SEGMENTS_EXECUTION_ID"]
        if not re.fullmatch(r"[a-zA-Z0-9_-]+", previous):
            raise ValueError("A valid segments_execution_id is required for Captioner")
        candidates = [root / "temp_seg" / "runs" / previous / "inference",
                      root / "tempseg" / previous]
        prior = next((path for path in candidates if path.is_dir()), None)
        if prior is None or not prior.resolve().is_relative_to(root):
            raise ValueError("No matching prior TempSeg execution inside this dataset")
        if stage != "validate":
            command += ["--segments-dir", str(prior)]
    if stage != "validate":
        if not (run / "validation" / "manifest.json").is_file():
            raise ValueError("Independent input validation must finish first")
        command += ["--run"]
    warning_prefixes = (
        "[transformers] The `use_fast` parameter is deprecated",
        "[transformers] Kwargs passed to `processor.__call__`",
        "[transformers] Qwen3VL video processing does not apply",
        "[transformers] `causal_conv1d_fn` is falling back",
        "[transformers] `chunk_gated_delta_rule` is falling back",
        "[transformers] `causal_conv1d_update` is falling back",
        "[transformers] `fused_recurrent_gated_delta_rule` is falling back",
    )
    progress = re.compile(r"^(?:Fetching \d+ files:|Loading weights:|\d+% (?:Finding actions|Loading the action segmenter|Stitching finished|Writing captions))")
    warning_context = False
    process = subprocess.Popen(command, stderr=subprocess.PIPE, text=True, bufsize=1)
    assert process.stderr is not None
    for line in process.stderr:
        stripped = line.strip()
        known_warning = stripped.startswith(warning_prefixes) or (
            "peft/mapping_func.py:" in stripped and "UserWarning:" in stripped
        )
        continuation = warning_context and stripped == "warnings.warn("
        target = sys.stdout if known_warning or continuation or progress.match(stripped) else sys.stderr
        print(line, end="", file=target, flush=True)
        warning_context = known_warning
    if process.wait():
        raise SystemExit(process.returncode)

    artifacts.mkdir(parents=True, exist_ok=True)
    shutil.copyfile(output / "manifest.json", artifacts / "manifest.json")
    if mode == "tempseg":
        document = json.loads((output / "results.json").read_text())
        if stage == "validate":
            shutil.copyfile(output / "results.json", artifacts / "validation.json")
        else:
            # Bounded inference may exit zero with a partial result. Never publish it.
            if document.get("schema_version") != "flora_results_v1" or document.get("complete") is not True:
                raise ValueError("TempSeg result is incomplete; archived diagnostics retained, canonical result unchanged")
            checked = json.loads((run / "validation" / "results.json").read_text())
            if document["selection"] != checked["selection"] or document["producer"] != checked["producer"]:
                raise ValueError("Selection or producer changed since preflight")
            expected = {(e["chunk"], str(e["episode_index"])) for e in document["selection"]["episodes"]}
            rows = document["results"][document["selection"]["dataset_key"]]
            actual = {(chunk, index) for chunk, values in rows.items() for index in values}
            if actual != expected:
                raise ValueError("Result does not cover the selected episode inventory")
            for chunk, index in expected:
                row = rows[chunk][index]
                prior = checked["results"][document["selection"]["dataset_key"]][chunk][index]
                if prior["status"] != "validated" or row["source"] != prior["source"]:
                    raise ValueError("Episode source differs from validated input")
                if row["status"] != "success" or row["processed_ranges"] != [{"start_frame": 0, "end_frame": row["frame_count"]}]:
                    raise ValueError("Episode lacks full successful model coverage")
            shutil.copyfile(output / "results.json", artifacts / "results.json")
            canonical = root / "temp_seg" / "results.json"
            if not canonical.resolve().is_relative_to(root):
                raise ValueError("Canonical result escapes dataset root")
            atomic_json(canonical, document)
    else:
        for part in output.glob("episode_*.json"):
            shutil.copyfile(part, artifacts / ("part-" + part.name))
  resolve_dataset_dir: |
    case "$DATASET_KIND" in
      dagger|umi) dataset_root="/data/jiwu-$DATASET_KIND" ;;
      *) echo "Unsupported dataset type." >&2; exit 2 ;;
    esac
    host_root="/mnt/sdb/jiwu-$DATASET_KIND"
    case "$DATASET_DIR" in
      /home/eisoc/data/debug_datapilot/*)
        dataset_root=/data/debug_datapilot
        relative_dir=${DATASET_DIR#/home/eisoc/data/debug_datapilot/}
        ;;
      /mnt/sdb/datasets/*)
        dataset_root=/data/datasets
        relative_dir=${DATASET_DIR#/mnt/sdb/datasets/}
        ;;
      "$host_root"/*)
        relative_dir=${DATASET_DIR#"$host_root"/}
        ;;
      ""|/*)
        echo "dataset_dir must be relative to the selected type mount or a supported absolute host path." >&2
        exit 2
        ;;
      *) relative_dir=$DATASET_DIR ;;
    esac
    if ! dataset=$(realpath -e -- "$dataset_root/$relative_dir") || [ ! -d "$dataset" ]; then
      echo "dataset_dir must identify an existing directory." >&2
      exit 2
    fi
    case "$dataset" in
      "$dataset_root"/*) ;;
      *) echo "dataset_dir must resolve below its dataset mount." >&2; exit 2 ;;
    esac
tasks:
  - id: validate
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: "{{ inputs.flora_image }}"
    outputFiles:
      - "kestra-output/manifest.json"
      - "kestra-output/validation.json"
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      host: unix:///var/run/docker.sock
      pullPolicy: NEVER
      user: "0:0"
      networkMode: none
      volumes:
        - /mnt/sdb/jiwu-dagger:/data/jiwu-dagger
        - /mnt/sdb/jiwu-umi:/data/jiwu-umi
        - /mnt/sdb/datasets:/data/datasets
        - /home/eisoc/data/debug_datapilot:/data/debug_datapilot
    env:
      STAGE: "validate"
      FLORA_IMAGE: "{{ inputs.flora_image }}"
      DATASET_KIND: "{{ inputs.dataset }}"
      DATASET_DIR: "{{ inputs.dataset_dir }}"
      DATASET_KEY: "{{ inputs.dataset_key | default('') }}"
      EPISODES_JSON: "{{ inputs.episodes | toJson }}"
      INCLUDE_FLAGS: "{{ inputs.include_flags }}"
      MAX_PARTS: "{{ inputs.max_parts }}"
      EXECUTION_ID: "{{ execution.id }}"
      MODEL_MODE: "{{ inputs.model_mode }}"
      SEGMENTS_EXECUTION_ID: "{{ inputs.segments_execution_id | default('') }}"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    commands:
      - |
        set -eu
        kestra_output="$PWD/kestra-output"
        {{ vars.resolve_dataset_dir }}
        cd /app
        python - "$dataset" "$kestra_output" <<'PYDRIVER'
        {{ vars.stage_driver }}
        PYDRIVER
  - id: annotate
    type: io.kestra.plugin.scripts.shell.Commands
    runIf: "{{ inputs.inference == true }}"
    containerImage: "{{ inputs.flora_image }}"
    outputFiles:
      - "kestra-output/manifest.json"
      - "kestra-output/results.json"
      - "kestra-output/part-*.json"
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      host: unix:///var/run/docker.sock
      pullPolicy: NEVER
      user: "0:0"
      networkMode: none
      deviceRequests:
        - driver: nvidia
          count: "1"
          capabilities: [[gpu]]
      volumes:
        - /mnt/sdb/jiwu-dagger:/data/jiwu-dagger
        - /mnt/sdb/jiwu-umi:/data/jiwu-umi
        - /mnt/sdb/datasets:/data/datasets
        - /home/eisoc/data/debug_datapilot:/data/debug_datapilot
        - /mnt/sdb/.datapilot-modelzoo:/model_zoo
    env:
      STAGE: "annotate"
      FLORA_IMAGE: "{{ inputs.flora_image }}"
      DATASET_KIND: "{{ inputs.dataset }}"
      DATASET_DIR: "{{ inputs.dataset_dir }}"
      DATASET_KEY: "{{ inputs.dataset_key | default('') }}"
      EPISODES_JSON: "{{ inputs.episodes | toJson }}"
      INCLUDE_FLAGS: "{{ inputs.include_flags }}"
      MAX_PARTS: "{{ inputs.max_parts }}"
      EXECUTION_ID: "{{ execution.id }}"
      MODEL_MODE: "{{ inputs.model_mode }}"
      SEGMENTS_EXECUTION_ID: "{{ inputs.segments_execution_id | default('') }}"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      FLORA_MODEL_CACHE: /model_zoo/flora/models
      HF_HOME: /model_zoo/huggingface
    commands:
      - |
        set -eu
        kestra_output="$PWD/kestra-output"
        {{ vars.resolve_dataset_dir }}
        cd /app
        python - "$dataset" "$kestra_output" <<'PYDRIVER'
        {{ vars.stage_driver }}
        PYDRIVER
